<!doctype html>
<!--
  ===========================================================================
  PAGE TEMPLATE — Willamette Web Design
  Copy this to a new folder as index.html, then replace every {{TOKEN}}.
  Folder-style URLs only: /services/website-design/index.html -> /services/website-design/

  Every block below maps to docs/SEO-HANDBOOK.md. Delete the guidance comments
  once the page is written, but do NOT delete the tags themselves — the
  preflight audit (npm run audit) will fail the build for missing ones.
  ===========================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ==== §3.1 On-page basics =============================================
     TITLE: ~50-60 chars. Keyword FIRST, brand LAST. Truncates past ~60.
       Good: "Website Design in {{CITY}}, OR | Willamette Web Design"
     DESCRIPTION: ~140-160 chars. This is ad copy that earns the click, not a
       ranking factor. Write it for a human scanning results.
     Both must be UNIQUE across every page on the site.
-->
<title>{{TITLE_50_60_CHARS}}</title>
<meta name="description" content="{{DESCRIPTION_140_160_CHARS}}">

<!-- Self-referencing canonical. Absolute https, trailing slash, apex host. -->
<link rel="canonical" href="https://willametteweb.com/{{PATH}}/">

<!-- ==== Local signals (§4) ==============================================
     Uncomment once the base city is confirmed in site.config.json.
     The (541) area code is NOT Salem — do not fill these in by assumption.
<meta name="geo.region" content="US-OR">
<meta name="geo.placename" content="{{CITY}}, Oregon">
<meta name="geo.position" content="{{LAT}};{{LON}}">
<meta name="ICBM" content="{{LAT}}, {{LON}}">
-->

<!-- ==== §3.1 Social preview ============================================= -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Willamette Web Design">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="https://willametteweb.com/{{PATH}}/">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:image" content="https://willametteweb.com/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">
<meta name="twitter:image" content="https://willametteweb.com/assets/img/og-image.png">

<meta name="theme-color" content="{{BRAND_INK_HEX}}">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<!-- ==== §2.5 Fonts — SELF-HOSTED, never fonts.googleapis.com ============
     Cross-origin Google Fonts costs DNS+TCP+TLS to two hosts before styled
     text renders. Preload only the weights actually used above the fold.
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/{{FONT}}.woff2" crossorigin>
-->

<!-- ==== §2.3 LCP image preload =========================================
     Only if the largest above-the-fold element is an image. Generate the
     derivatives with: node scripts/optimize-images.mjs hero.jpg --hero
<link rel="preload" as="image" type="image/avif" href="/assets/img/hero-640.avif"
      imagesrcset="/assets/img/hero-640.avif 640w, /assets/img/hero-960.avif 960w,
                   /assets/img/hero-1280.avif 1280w"
      imagesizes="100vw" fetchpriority="high">
-->

<!-- ==== §2.4 CSS — inlined, not linked =================================
     The stylesheet is small enough to inline, which removes a render-blocking
     round-trip. Run `npm run css` to regenerate this block from
     assets/css/site.css. Do not add <link rel="stylesheet"> back.
-->
<style id="site-css">/* Generated by `npm run css` from assets/css/site.css.
     Do not hand-edit this block — it is overwritten on every run. */</style>

<!-- Page-local styles only. `npm run css` never touches this block. Anything
     used on more than one page belongs in assets/css/site.css instead. Delete
     this block entirely if the page needs no local rules. -->
<style id="page-css"></style>

<!-- ==== §3.3 Structured data ===========================================
     Only mark up what is VISIBLE on the page. Validate at
     search.google.com/test/rich-results before shipping.

     Page-type map (handbook §3.3):
       Home         -> LocalBusiness + Organization + WebSite + FAQPage
       Services hub -> ItemList + BreadcrumbList
       Service page -> Service + BreadcrumbList + FAQPage
       City page    -> Service with areaServed = that city
       About/Contact-> AboutPage / ContactPage + BreadcrumbList

     NON-NEGOTIABLE: no aggregateRating and no Review until real reviews
     exist. sameAs only for profiles actually owned and verified. The audit
     script fails the build on both.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://willametteweb.com/#website",
      "url": "https://willametteweb.com/",
      "name": "Willamette Web Design",
      "publisher": { "@id": "https://willametteweb.com/#organization" },
      "inLanguage": "en-US"
    },
    {
      "@type": "Organization",
      "@id": "https://willametteweb.com/#organization",
      "name": "Willamette Web Design",
      "url": "https://willametteweb.com/",
      "email": "info@willametteweb.com",
      "telephone": "+15414979531",
      "logo": {
        "@type": "ImageObject",
        "url": "https://willametteweb.com/assets/img/logo.png"
      }
      /* "sameAs": [] — add ONLY verified, owned profile URLs. Omit until then. */
    }
    /* Add the page-type node here (Service / BreadcrumbList / FAQPage / ...). */
  ]
}
</script>
</head>

<body>
<a class="skip" href="#main">Skip to content</a>

<header>
  <!-- Nav. The phone must be a tel: link here, in the footer, and in the
       mobile bar — a visible number that isn't tappable is a conversion leak. -->
  <a href="tel:+15414979531">(541) 497-9531</a>
</header>

<!-- §3.1 <main> landmark + exactly one <h1> on the page. -->
<main id="main">

  <!-- §3.5 Visible breadcrumb, mirrored by BreadcrumbList schema above.
       Every important page reachable in <= 3 clicks from home. -->

  <h1>{{ONE_H1_MATCHING_PAGE_INTENT}}</h1>

</main>

<footer>
  <p><a href="tel:+15414979531">(541) 497-9531</a></p>
  <p><a href="mailto:info@willametteweb.com">info@willametteweb.com</a></p>
</footer>

<!-- ==== §2.6 Analytics — deferred, never blocking ======================
     gtag.js is ~66 KB of main-thread work for data nobody needs in the first
     3 seconds. Queue the config immediately, load the script on first
     interaction or after 3s idle. This pattern is what drove the reference
     site's TBT to 0 ms. Set GA4_MEASUREMENT_ID in site.config.json first.
-->
<script>
(function () {
  var ID = '{{GA4_MEASUREMENT_ID}}';
  if (!ID || ID.charAt(0) === '{') return;

  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  window.gtag = gtag;
  gtag('js', new Date());
  gtag('config', ID);

  var loaded = false;
  function load() {
    if (loaded) return;
    loaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
    document.head.appendChild(s);
  }
  ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'].forEach(function (e) {
    window.addEventListener(e, load, { once: true, passive: true });
  });
  setTimeout(load, 3000);
})();
</script>
</body>
</html>
